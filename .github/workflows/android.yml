name: Workspace file reference mobile validation
on:
  workflow_dispatch:
    inputs:
      android_only:
        description: Retry only Android
        type: boolean
        default: false
      ios_only:
        description: Retry only iOS
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  mobile:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.android_only && '["android"]' || inputs.ios_only && '["ios"]' || '["ios","android"]') }}
    runs-on: ${{ matrix.platform == 'ios' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
          cache-on-failure: true
      - name: Build host
        working-directory: host
        run: |
          rustup toolchain install
          cargo build --locked --bin codync-host
      - name: Install Maestro
        shell: bash
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Install iPhone simulator app
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for v in json.load(sys.stdin)["devices"].values() for d in v if d["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$device" -b
          xcodebuild build -project apps/Codync.xcodeproj -scheme 'iOS Dev' -configuration DevDebug -destination "platform=iOS Simulator,id=$device" -derivedDataPath build/dd CODE_SIGN_IDENTITY=- -quiet
          app=$(find build/dd/Build/Products/DevDebug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          # 无证书的 simulator ad-hoc 签名仍须包含 Keychain entitlement。
          codesign -d --entitlements - "$app" > "$RUNNER_TEMP/simulator-entitlements.plist"
          grep -q keychain-access-groups "$RUNNER_TEMP/simulator-entitlements.plist"
          xcrun simctl install "$device" "$app"
          echo "CODYNC_TEST_DEVICE=$device" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          packages: platform-tools
      # 复用同一发布候选 Android CI 已通过构建的 APK。
      - uses: actions/download-artifact@v4
        if: matrix.platform == 'android'
        with:
          name: codync-android-debug
          run-id: 43011502071
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/codync-validation-apk
      - name: Install Android emulator app
        if: matrix.platform == 'android'
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
          sdkmanager 'emulator' 'system-images;android-36;google_apis;x86_64'
          export ANDROID_USER_HOME="$RUNNER_TEMP/codync-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          # avdmanager 与 emulator 显式使用同一目录，且先确认虚拟设备可见。
          echo no | avdmanager create avd -f -n codync_worktree -k 'system-images;android-36;google_apis;x86_64' -d pixel_7 -p "$ANDROID_AVD_HOME/codync_worktree.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx codync_worktree
          "$ANDROID_HOME/emulator/emulator" -avd codync_worktree -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          sleep 8
          if ! kill -0 "$emulator_pid"; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
          timeout 180 adb wait-for-device
          timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
          apk=$(find "$RUNNER_TEMP/codync-validation-apk" -name app-debug.apk -print -quit)
          test -n "$apk"
          adb install -r "$apk"
          adb reverse tcp:19391 tcp:19391
          adb shell pm grant com.pokai.Codync.android.dev android.permission.POST_NOTIFICATIONS
          echo 'CODYNC_TEST_DEVICE=emulator-5554' >> "$GITHUB_ENV"
      - name: Exercise the installed client against the host
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: python3 apps/maestro/validate-workspace-file.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workspace-file-validation-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/workspace-file-validation/maestro
            ${{ runner.temp }}/workspace-file-validation/host.log
            ${{ runner.temp }}/emulator.log
