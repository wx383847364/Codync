name: Release desktop

# The Electron app (apps/desktop) for macOS, Linux and Windows. A v* tag publishes it; anything else is a
# dry run that builds and signs but publishes nothing. Notarizing (minutes of waiting on Apple) runs on
# tags and on release PRs into main, so a notarization problem still shows before the tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/release-desktop.yml"]
  workflow_dispatch:
    inputs:
      windows_only:
        description: Build only Windows x64 and ARM64
        type: boolean
        default: false

permissions:
  contents: write

# A newer push to the same PR supersedes the run in progress; tag runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.scope.outputs.package }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Package on this run?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # Tags, manual runs and release PRs into main always package. Other PRs package only when they
        # touch what the installers are built from: the main process, preload, build config, tools,
        # resources, dependencies, the shared app config, the Mac screen helper and packaging/. A
        # renderer-only change is covered by typecheck, tests and the build.
        run: |
          if [ "$EVENT" != pull_request ] || [ "$BASE_REF" = main ]; then
            echo package=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only FETCH_HEAD HEAD | grep -Eq '^(apps/desktop/(package(-lock)?\.json|electron-builder[^/]*|electron\.vite\.config\.ts|tools/|src/main/|src/preload/|src/shared/|resources/|native/)|apps/shared/Config/|apps/screen-macos/|packaging/|\.github/workflows/release-desktop\.yml)'; then
            echo package=true >> "$GITHUB_OUTPUT"
          else
            echo package=false >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Version matches the host
        # The host's minApp is compared with this app's version (docs/reference/compatibility.md).
        run: |
          APP=$(node -p 'require("./package.json").version')
          HOST=$(python3 -c 'import tomllib; print(tomllib.load(open("../../host/Cargo.toml", "rb"))["package"]["version"])')
          test "$APP" = "$HOST" || { echo "apps/desktop ($APP) and host ($HOST) versions must match"; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  macos:
    needs: check
    # Fork PRs get no signing secrets, so they stop at check, Windows and Linux; the release PR into main
    # builds the Mac app before the tag.
    if: needs.check.outputs.package == 'true' && !inputs.windows_only && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust (host/rust-toolchain.toml)
        working-directory: host
        run: rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
        working-directory: host
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
          # Saved on main by rust-cache.yml.
          shared-key: desktop-macos

      - name: Install Apple certificate
        env:
          MACOS_SIGNING_TEAM_ID: ${{ vars.MACOS_SIGNING_TEAM_ID }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          [[ "$MACOS_SIGNING_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo 'Set MACOS_SIGNING_TEAM_ID to your Apple Team ID'; exit 1; }
          test -n "$APPLE_CERTIFICATE_P12" && test -n "$APPLE_CERTIFICATE_PASSWORD" ||
            { echo 'Configure the Developer ID Application certificate and password'; exit 1; }
          KEYCHAIN_FILE=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_FILE"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security list-keychain -d user -s "$KEYCHAIN_FILE"

      - name: Native pieces
        run: |
          mkdir -p apps/desktop/build/native
          # The host is built by `npm run dist:mac:main` (tools/native-host.mjs) for the same environment.
          # On-device speech for calls.
          swift build -c release --arch arm64 --arch x86_64 --package-path apps/desktop/native/speech-macos
          cp "$(swift build -c release --arch arm64 --arch x86_64 --package-path apps/desktop/native/speech-macos --show-bin-path)/codync-speech" \
            apps/desktop/build/native/codync-speech
          # Codync Screen is built by `npm run dist:mac:main` (tools/native-screen.mjs).
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec apps/project.yml
          swift packaging/dmg/background.swift apps/desktop/build/dmg-background.tiff

      - name: Build, sign and notarize
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          # Same-repo PRs get the secrets; sign them too so the dry run checks the real app.
          CSC_FOR_PULL_REQUEST: "true"
          # Notarized with the App Store Connect API key: unlike an app-specific password, it
          # survives Apple ID password changes.
          NOTARIZE: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          MACOS_SIGNING_TEAM_ID: ${{ vars.MACOS_SIGNING_TEAM_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$APPLE_API_KEY"
          # electron-builder skips notarizing only when all three are unset (one alone is an error).
          [ "$NOTARIZE" = true ] || unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          npm ci
          npm run icons
          # Electron 更新源与构建仓库一致，避免分支安装后读取另一签名团队的包。
          npm run dist:mac:main -- --publish never \
            -c.publish.owner="$GITHUB_REPOSITORY_OWNER" -c.publish.repo="${GITHUB_REPOSITORY#*/}"
          codesign -d --entitlements - dist/mac-universal/Codync.app | grep -q com.apple.security.device.audio-input ||
            { echo "audio-input entitlement missing"; exit 1; }
          mac_app=dist/mac-universal/Codync.app
          helper_path=Contents/Library/LoginItems/CodyncScreen.app
          screen_app="$mac_app/$helper_path"
          codesign --verify --deep --strict "$mac_app"
          # 固定团队和 Bundle ID，并要求两份代码都是 Developer ID Application 签名。
          developer_id='anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] exists and certificate leaf[field.1.2.840.113635.100.6.1.13] exists'
          team_requirement="certificate leaf[subject.OU] = \"${MACOS_SIGNING_TEAM_ID}\""
          codesign --verify --all-architectures -R="identifier \"com.pokai.Codync\" and $developer_id and $team_requirement" "$mac_app"
          codesign --verify --all-architectures -R="identifier \"com.pokai.Codync.screen\" and $developer_id and $team_requirement" "$screen_app"
          if [ "$NOTARIZE" = true ]; then spctl --assess --type execute -v "$mac_app"; fi

          # 核对实际打包的 Electron 更新源，避免命令行配置没有生效。
          node -e 'const fs = require("node:fs"); const feed = require("yaml").parse(fs.readFileSync(process.argv[1], "utf8")); if (feed.provider !== "github" || feed.owner + "/" + feed.repo !== process.env.GITHUB_REPOSITORY) process.exit(1)' \
            "$mac_app/Contents/Resources/app-update.yml"

      - name: Verify Mac signing against previous release
        shell: bash
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mac_app=dist/mac-universal/Codync.app
          screen_app="$mac_app/Contents/Library/LoginItems/CodyncScreen.app"
          developer_id='anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] exists and certificate leaf[field.1.2.840.113635.100.6.1.13] exists'
          # 用本仓库上一份正式 Mac 包的 designated requirement 验证新包能继承旧授权。
          # 首次签名迁移时可能没有标准 Mac zip，此时上面的固定团队要求作为基线。
          previous_tag=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=50" |
            jq -rs --arg current "$GITHUB_REF_NAME" '[.[][] | select(.draft == false and .prerelease == false and (.tag_name | startswith("v")) and .tag_name != $current and any(.assets[]; .name == "codync-macos.zip"))][0].tag_name // ""')
          if [ -n "$previous_tag" ]; then
            previous_dir=$(mktemp -d "$RUNNER_TEMP/codync-previous.XXXXXX")
            gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --pattern codync-macos.zip --dir "$previous_dir"
            ditto -x -k "$previous_dir/codync-macos.zip" "$previous_dir"
            previous_app="$previous_dir/Codync.app"
            codesign --verify --strict "$previous_app"
            for bundle in "$mac_app" "$screen_app"; do
              previous_bundle="$previous_app${bundle#"$mac_app"}"
              if [ ! -d "$previous_bundle" ]; then
                echo "No previous bundle for $bundle. This release starts its signed baseline."
                continue
              fi
              codesign --verify --strict "$previous_bundle"
              if codesign --verify --all-architectures -R="$developer_id" "$previous_bundle"; then
                previous_requirement=$(codesign -d -r- "$previous_bundle" 2>&1 | sed -nE 's/^(# )?designated => //p')
                test -n "$previous_requirement" || { echo "Missing previous signing requirement: $previous_bundle"; exit 1; }
                codesign --verify --all-architectures -R="$previous_requirement" "$bundle"
              else
                # 旧包没有 Developer ID 身份，切换到正式包后由用户重新授权一次。
                echo "Previous bundle $previous_bundle has no Developer ID signature. This release starts its signed baseline."
              fi
            done
          else
            echo 'No previous standard Mac release zip is available for upgrade verification.'
          fi

      - name: Legacy Sparkle feed
        # 旧版原生应用固定信任上游公钥，自有仓库的 Electron 包单独走 Electron 更新源。
        if: github.repository == 'leepokai/Codync'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION=$(node -p 'require("./apps/desktop/package.json").version')
          # Installs of the earlier native app update through Sparkle: one more appcast, now for the zip.
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'SPARKLE_PRIVATE_KEY is required'; exit 1; }
          curl -sSL https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz | tar xJ -C "$RUNNER_TEMP"
          mkdir -p build/updates && cp apps/desktop/dist/codync-macos.zip build/updates/
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/bin/generate_appcast" --ed-key-file - --maximum-deltas 0 \
            --download-url-prefix "https://github.com/leepokai/Codync/releases/download/v${VERSION}/" \
            --link https://www.codync.dev/ -o build/appcast.xml build/updates
          python3 -m venv "$RUNNER_TEMP/update-verification"
          "$RUNNER_TEMP/update-verification/bin/pip" install 'cryptography>=44,<47'
          "$RUNNER_TEMP/update-verification/bin/python" packaging/updates/verify-appcast.py \
            build/appcast.xml apps/desktop/dist/mac-universal/Codync.app apps/desktop/dist/codync-macos.zip

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: codync-macos
          path: |
            apps/desktop/dist/codync-macos.dmg
            apps/desktop/dist/latest-mac.yml
            build/appcast.xml

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/desktop/dist
          shasum -a 256 codync-macos.dmg > codync-macos.dmg.sha256
          FILES="codync-macos.dmg codync-macos.dmg.sha256 codync-macos.zip codync-macos.zip.blockmap"
          # Auto Tag or the host workflow has usually created this release already (same tag). Not
          # latest: release-gate.yml marks it (and updates the Homebrew tap) once it's safe to offer.
          gh release create "$GITHUB_REF_NAME" $FILES --title "Codync $GITHUB_REF_NAME" --generate-notes --latest=false ||
            gh release upload "$GITHUB_REF_NAME" $FILES --clobber
          # Update feeds last: the release gate takes a release with all its feeds as fully uploaded.
          mac_feeds=(latest-mac.yml)
          if [ -f ../../../build/appcast.xml ]; then mac_feeds+=(../../../build/appcast.xml); fi
          gh release upload "$GITHUB_REF_NAME" "${mac_feeds[@]}" --clobber

  windows:
    needs: check
    if: needs.check.outputs.package == 'true'
    # The bundled host's Cargo profile (tools/native-host.mjs). Dry runs on PRs into dev build `dev-app`:
    # release minus thin LTO and the single codegen unit, about 3 minutes less per build. Tags and
    # release PRs into main build the `release` profile that ships. The macOS job stays on `release`,
    # the only profile in the cache rust-cache.yml saves for it.
    env:
      CODYNC_HOST_PROFILE: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' && 'dev-app' || 'release' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: x64, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, arch: arm64, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust (host/rust-toolchain.toml)
        working-directory: host
        run: |
          rustup set default-host ${{ matrix.target }}
          rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
          # A fully matched cache is never saved again, so each profile keeps its own.
          key: ${{ env.CODYNC_HOST_PROFILE }}
      - name: Initialize Windows networking provider
        shell: powershell
        # The first CIM query on a fresh ARM runner can exceed the SSH tool's 30-second timeout.
        run: Get-NetTCPConnection -State Listen -ErrorAction Stop | Out-Null
      - name: Build
        working-directory: apps/desktop
        # Unsigned for now: SmartScreen warns on first launch until the app has a code signing certificate.
        run: |
          test "$(node -p process.arch)" = '${{ matrix.arch }}'
          npm ci
          node --test --experimental-strip-types src/shared/ssh-platform.test.ts
          npm run dist:win:main -- --${{ matrix.arch }} --publish never
          cd dist
          sha256sum codync-windows-${{ matrix.arch }}.exe > codync-windows-${{ matrix.arch }}.exe.sha256
      - name: Install
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $PWD 'apps\desktop\dist\codync-windows-${{ matrix.arch }}.exe'
          $installation = Join-Path $env:LOCALAPPDATA 'Programs\codync-desktop'
          $process = Start-Process -FilePath $installer -ArgumentList '/S','/currentuser',('/D='+$installation) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          "CODYNC_INSTALLED_RESOURCES=$installation\resources" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check the installed executables' architecture
        working-directory: ${{ env.CODYNC_INSTALLED_RESOURCES }}
        run: |
          node -e "const { peArch } = require(process.argv[1]); for (const exe of process.argv.slice(2)) if (peArch(exe) !== '${{ matrix.arch }}') throw new Error('Wrong installed architecture: ' + exe)" \
            "$GITHUB_WORKSPACE/apps/desktop/tools/verify-build.cjs" ../Codync.exe codync-host.exe codync-hostw.exe
      - name: Smoke test the bundled host
        working-directory: ${{ env.CODYNC_INSTALLED_RESOURCES }}
        run: |
          ./codync-host.exe --version
          CODYNC_HOME="$RUNNER_TEMP/codync" ./codync-host.exe serve --port 19333 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:19333/health && break; sleep 1; done
          curl -sf http://127.0.0.1:19333/health | grep -q computerId
          TOKEN=$(cat "$RUNNER_TEMP/codync/token")
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:19333/api/refreshBackends
      - uses: actions/upload-artifact@v4
        with:
          name: codync-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/codync-windows-${{ matrix.arch }}.exe
            apps/desktop/dist/codync-windows-${{ matrix.arch }}.exe.sha256
            apps/desktop/dist/codync-windows-${{ matrix.arch }}.exe.blockmap
            apps/desktop/dist/latest.yml
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          make_latest: false
          files: |
            apps/desktop/dist/codync-windows-${{ matrix.arch }}.exe
            apps/desktop/dist/codync-windows-${{ matrix.arch }}.exe.sha256
            apps/desktop/dist/codync-windows-${{ matrix.arch }}.exe.blockmap

  windows-update-feed:
    needs: windows
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: codync-windows-*
          path: apps/desktop/dist
      # Both architectures share latest.yml. Publish it only after both installers are uploaded.
      - run: node tools/windows-update-feed.mjs dist/codync-windows-x64/latest.yml dist/codync-windows-arm64/latest.yml dist/latest.yml
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: codync-windows-update-feed
          path: apps/desktop/dist/latest.yml
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          make_latest: false
          files: apps/desktop/dist/latest.yml

  linux:
    needs: check
    if: needs.check.outputs.package == 'true' && !inputs.windows_only
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x64, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, arch: arm64, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      # The Linux app uses the installed codync-host (codync-host-linux-*.tar.gz, host.yml).
      - name: Build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run dist:linux:main -- --${{ matrix.arch }} --publish never
          # The website links releases/latest/download/codync-<os>-<arch>.tar.gz.
          cd dist
          # electron-builder names x64 tar.gz `x64` and deb `amd64`; the update feed follows the renames.
          for f in codync-linux-x64.* codync-linux-amd64.*; do
            [ -e "$f" ] || continue
            to="codync-${{ matrix.name }}.${f#*.}"
            mv "$f" "$to"
            sed -i "s|$f|$to|g" latest-linux*.yml
          done
          for f in codync-${{ matrix.name }}.*; do shasum -a 256 "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: codync-${{ matrix.name }}
          path: apps/desktop/dist/codync-${{ matrix.name }}.*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          make_latest: false
          files: apps/desktop/dist/codync-${{ matrix.name }}.*
      # The update feed last, once the packages it points at are downloadable.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          make_latest: false
          files: apps/desktop/dist/latest-linux*.yml
