# 手机需先与任务沙箱配对。复用 mentions.js 创建测试群和成员。
# maestro test --include-tags group-session -e HOST_PORT=<port> -e HOST_TOKEN=<token> apps/maestro
appId: com.pokai.Codync.ios.dev
tags:
  - group-session
onFlowComplete:
  - runScript:
      file: mentions.js
      env:
        CLEANUP: "true"
---
- runScript:
    file: mentions.js
    env:
      TASK_GROUP_TEST: "true"
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          appId: com.pokai.Codync.ios.dev
          arguments:
            "-reviewInvitationOff": true
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          appId: com.pokai.Codync.android.dev
# 已配对的设备仍可能从免登录欢迎页启动，先进入机器人列表再测试群菜单。
- extendedWaitUntil:
    visible: "(${output.group}|Continue without an account)"
    timeout: 60000
- runFlow:
    when:
      visible: "Continue without an account"
    commands:
      - tapOn: "Continue without an account"
- extendedWaitUntil:
    visible: ${output.group}
    timeout: 60000
- longPressOn: ${output.group}
- tapOn: "Create new group session"
- assertVisible: "Search or add bots"
- assertVisible: "Start a new task with fresh bots."
- tapOn: "Create"
- assertVisible: "${output.group} 1"
- assertVisible: "Ask everyone.*"
# 近况移到成员设置，新的独立群尚无读数。
- assertNotVisible: "Member context"
- tapOn: "${output.group} 1, view details"
- assertVisible: "Member context"
- assertVisible: "No session yet"
- tapOn: "1M"
- tapOn: "256K"
- assertVisible: "512K"
- takeScreenshot: group-session
# 在同一成员页确认名单，并删除本流程创建的新群。
- assertVisible: ${output.alpha}
- assertVisible: ${output.beta}
- scrollUntilVisible:
    element: "Delete group chat"
    direction: DOWN
- tapOn: "Delete group chat"
- assertVisible: "Delete only group chat"
- tapOn: "Delete group and its bots"
- extendedWaitUntil:
    notVisible: "${output.group} 1"
    timeout: 15000
# 从同一个来源群建立下一阶段，预览范围后用新角色打开空白群。
- extendedWaitUntil:
    visible: "${output.group}"
    timeout: 15000
- longPressOn:
    text: "^${output.group}$"
- tapOn: "Create next stage group"
- assertVisible: "Previous group · ${output.group}"
- tapOn: "Show bot list"
- tapOn: "${output.alpha}"
- tapOn: "Create"
- assertVisible: "${output.group} · ${output.alpha}"
- assertVisible: "Ask everyone.*"
