appId: com.pokai.Codync.ios.dev
---
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          appId: com.pokai.Codync.ios.dev
          arguments:
            "-reviewInvitationOff": true
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          appId: com.pokai.Codync.android.dev
      # 冷启动时系统界面可能暂时失去响应，关闭系统遮罩后再读应用。
      - tapOn:
          text: "Wait"
          optional: true
- tapOn: "Continue without an account"
- tapOn: "Continue"
- tapOn: "Pairing link or code"
- runScript: workspace-file-pairing.js
- inputText: ${output.pairingUrl}
- tapOn: "Pair"
- extendedWaitUntil:
    visible: "Workspace Reference Check"
    timeout: 90000
- tapOn: "Workspace Reference Check"
- tapOn: "Ask Workspace Reference Check"
- inputText: "READ_WORKSPACE_FILE /guide"
- extendedWaitUntil:
    visible: "guide.md"
    timeout: 20000
- assertVisible: "READ_WORKSPACE_FILE /guide"
- pressKey: Enter
- assertNotVisible: "Selected mobile workspace contents"
- assertVisible: "READ_WORKSPACE_FILE @guide.md.*"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Selected mobile workspace contents"
    timeout: 20000
